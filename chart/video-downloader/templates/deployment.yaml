apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "video-downloader.fullname" . }}
spec:
  replicas: 1
  # A hostPort cannot be bound by the old and new pods simultaneously on one node.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "video-downloader.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "video-downloader.fullname" . }}
    spec:
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}
      containers:
        - name: downloader
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
              hostPort: {{ .Values.hostPort }}
          env:
            - name: DOWNLOAD_DIR
              value: {{ .Values.downloadDirectory.path | quote }}
            - name: STATE_DIR
              value: /var/lib/video-downloader
            - name: JELLYFIN_REFRESH_ON_COMPLETE
              value: {{ .Values.jellyfin.enabled | quote }}
            - name: JELLYFIN_URL
              value: {{ .Values.jellyfin.url | quote }}
            - name: JELLYFIN_MIN_REFRESH_INTERVAL_SECONDS
              value: {{ .Values.jellyfin.minRefreshIntervalSeconds | quote }}
{{- if .Values.jellyfin.existingSecret }}
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jellyfin.existingSecret | quote }}
                  key: {{ .Values.jellyfin.apiKeySecretKey | quote }}
{{- end }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/video-downloader
            - name: media
              mountPath: {{ .Values.downloadDirectory.path | quote }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: state
          hostPath:
            path: {{ .Values.stateDirectory.hostPath | quote }}
            type: DirectoryOrCreate
        - name: media
{{- if .Values.existingDownloadClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.existingDownloadClaim | quote }}
{{- else }}
          hostPath:
            path: {{ .Values.downloadDirectory.hostPath | quote }}
            type: DirectoryOrCreate
{{- end }}
